};
const t=k=>(T[db.lang]?.[k]??T.en[k]??k);

const SC={P:'bg-emerald-100 text-emerald-700 dark:bg-emerald-500/20 dark:text-emerald-300',L:'bg-orange-100 text-orange-700 dark:bg-orange-500/20 dark:text-orange-300',E:'bg-sky-100 text-sky-700 dark:bg-sky-500/20 dark:text-sky-300',A:'bg-rose-100 text-rose-700 dark:bg-rose-500/20 dark:text-rose-300'};

const badge=st=>`<span class="text-[11px] font-semibold px-2 py-0.5 rounded-full ${SC[st]}">${t(LBL[st])}</span>`;
const rl=r=>t(r==='Head'?'hRole':r==='Assistant'?'aRole':'mRole');
const memberById=id=>db.members.find(m=>m.id===id);
const act=()=>db.events.find(e=>e.id===db.active);
const actives=()=>db.members.filter(m=>!m.exp);
const recFor=(eid,mid)=>db.att.find(a=>a.eid===eid&&a.mid===mid);
const stats=eid=>{const ok=new Set(clubMembers().map(m=>m.id)),c={P:0,L:0,E:0};db.att.forEach(a=>{if(a.eid===eid&&ok.has(a.mid))c[a.st]++});c.A=Math.max(0,ok.size-c.P-c.L-c.E);c.rate=ok.size?Math.round((c.P+c.L)/ok.size*100):0;return c;};
const applyTheme=()=>document.documentElement.classList.toggle('dark',db.theme==='dark');
const refresh=()=>tab==='scan'?renderRes():render();
const btns=fn=>`<div class="flex gap-2 pt-2"><button onclick="closeM()" class="flex-1 rounded-xl py-2.5 text-sm font-semibold bg-slate-100 dark:bg-slate-700">${t('cancel')}</button><button onclick="${fn}()" class="${B} flex-1">${t('save')}</button></div>`;
const tile=(l,v,c)=>`<div class="${C}"><div class="text-xs font-semibold text-${c}-600 dark:text-${c}-300">${l}</div><div class="text-3xl font-bold mt-1">${v}</div></div>`;

function banner(html,k='r'){const b=$('#banner');b.className=`fixed top-3 inset-x-3 max-w-md mx-auto z-[60] rounded-2xl p-4 text-white shadow-2xl ${k==='g'?'bg-emerald-600':k==='o'?'bg-orange-500':'bg-rose-600'}`;b.innerHTML=html;clearTimeout(bt);bt=setTimeout(()=>b.classList.add('hidden'),3000);}
function modal(title,body){$('#mt').textContent=title;$('#mb').innerHTML=body;$('#modal').classList.replace('hidden','flex');}
function closeM(){$('#modal').classList.replace('flex','hidden');}

function chime(late){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume();const s=AC.currentTime;(late?[[880,0],[659,.14]]:[[1318.5,0],[1568,.12]]).forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(0,s+d);g.gain.linearRampToValueAtTime(.3,s+d+.02);g.gain.exponentialRampToValueAtTime(.001,s+d+.4);o.start(s+d);o.stop(s+d+.45);});}catch(e){}}

function render(){applyTheme();$('#ttl').textContent=t('title');$('#sub').textContent=t('sub');$('#lang').innerHTML=['tj','ru','en'].map(l=>`<button onclick="setLang('${l}')" class="px-2.5 py-1 rounded-full text-[11px] font-bold ${db.lang===l?'bg-white text-[#643860]':'text-white/70'}">${l.toUpperCase()}</button>`).join('');$('#themeBtn').textContent=db.theme==='dark'?'☀':'☾';$('#nav').innerHTML=NAV.map(([k,i])=>`<button onclick="go('${k}')" class="flex-1 flex flex-col items-center py-2.5 text-[11px] font-semibold ${tab===k?'text-[#643860] dark:text-sky-300':'text-slate-400'}"><span class="text-lg leading-none mb-1">${i}</span>${t(k)}</button>`).join('');$('#view').innerHTML=V[tab]();if(tab==='members')renderMembers();if(tab==='scan')renderRes();}
async function go(k){if(tab==='scan'&&k!=='scan')await stopCam();tab=k;render();}
async function setLang(l){if(tab==='scan')await stopCam();db.lang=l;save();render();}
function toggleTheme(){db.theme=db.theme==='dark'?'light':'dark';save();applyTheme();$('#themeBtn').textContent=db.theme==='dark'?'☀':'☾';}

/* ---------- Dashboard ---------- */
function deviceDate(){return new Date().toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short',year:'numeric'});}
function syncDate(){dayKey=ld();render();}
function vDash(){
  const today=ld(),cur=db.events.find(e=>e.date===today),nxt=db.events.filter(e=>e.date>today).sort((a,b)=>(a.date+a.start)<(b.date+b.start)?-1:1)[0],ev=cur||nxt;
  const sc=cur?stats(cur.id):null,held=db.events.filter(e=>e.date<=today),avg=held.length?Math.round(held.reduce((x,y)=>x+stats(y.id).rate,0)/held.length):0;
  const top=clubMembers().map(m=>({m,c:partCount(m.id)})).filter(x=>x.c>0).sort((a,b)=>b.c-a.c).slice(0,5);
  return `<div class="flex items-center justify-between mb-3 text-xs text-slate-500"><span>${t('deviceDate')}: <b class="text-slate-700 dark:text-slate-200">${deviceDate()}</b></span><button onclick="syncDate()" class="font-semibold px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-700">⟳ ${t('sync')}</button></div>
  <div class="${C} mb-4 bg-gradient-to-br from-[#643860] to-[#462743] text-white border-0">${ev?`<div class="text-xs text-white/70">${cur?t('todayEv'):t('nextEv')}</div><div class="text-xl font-extrabold mt-1">${esc(ev.name)}</div><div class="text-xs text-white/70 mt-1">${ev.date} · ${ev.start}–${ev.end}</div>${cur?`<div class="text-4xl font-extrabold mt-3">${sc.rate}%</div><div class="text-xs text-white/70">${t('rate')}</div>`:''}`:`<div class="text-sm text-white/80">${t('noUp')}</div>`}</div>
  ${cur?`<div class="grid grid-cols-2 gap-3 mb-4">${tile(t('present'),sc.P,'emerald')}${tile(t('late'),sc.L,'orange')}${tile(t('excused'),sc.E,'sky')}${tile(t('absent'),sc.A,'rose')}</div>`:''}
  <div class="grid grid-cols-2 gap-3 mb-4">${tile(t('held'),held.length,'slate')}${tile(t('upcomingCnt'),db.events.length-held.length,'emerald')}${tile(t('total'),clubMembers().length,'slate')}${tile(t('avg'),avg+'%','sky')}</div>
  <div class="${C}"><div class="font-semibold mb-1">${t('top5')}</div>${top.length?top.map((x,i)=>`<div class="flex justify-between items-center py-2 border-b last:border-0 border-slate-100 dark:border-slate-700 text-sm"><span class="truncate">${i+1}. ${esc(x.m.name)}</span><span class="font-bold">${x.c}</span></div>`).join(''):`<div class="text-sm text-slate-500 py-2">${t('noData')}</div>`}</div>`;
}

/* ---------- Scanner ---------- */
const evSel=()=>`<select onchange="setActive(this.value)" class="${I}"><option value="">${t('none')}</option>${db.events.map(e=>`<option value="${e.id}" ${e.id===db.active?'selected':''}>${esc(e.name)} · ${e.date} ${e.start}</option>`).join('')}</select>`;
function setActive(id){db.active=id;save();refresh();}
function vScan(){return `<div class="${C} mb-3 space-y-3"><div class="text-[11px] font-semibold text-slate-500 uppercase tracking-wide">${t('active')}</div>${evSel()}<div id="reader" class="rounded-xl overflow-hidden bg-slate-900 min-h-[200px]"></div><button id="camBtn" onclick="camToggle()" class="${B} w-full">${t('cam')}</button></div><input id="q" oninput="renderRes()" placeholder="${t('search')}" class="${I} mb-3"><div id="res"></div>`;}
const setCB=s=>{const b=$('#camBtn');if(b)b.textContent=s;};
async function stopCam(){if(running){running=false;try{await qr.stop()}catch(e){}}qr=null;}
async function camToggle(){
  if(running){await stopCam();setCB(t('cam'));return;}
  if(!act())return banner(t('noEvt'));
  try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume();}catch(e){}
  try{qr=new Html5Qrcode('reader');await qr.start({facingMode:'environment'},{fps:10,qrbox:{width:230,height:230}},onScan,()=>{});running=true;setCB(t('camStop'));}
  catch(e){qr=null;banner(esc(e.message||e));}
}
function onScan(txt){const now=Date.now();if(txt===lastC&&now-lastT<2500)return;lastC=txt;lastT=now;const m=/^ROHBALAD-(M\d{3})$/.exec(txt.trim());m?checkIn(m[1]):banner(t('unk'));}

function checkIn(mid,forced){
  const m=memberById(mid),e=act(),day=ld(),now=new Date();
  if(!m)return banner(t('unk'));
  if(!e)return banner(t('noEvt'));
  if(m.exp)return banner(`${esc(m.name)} — ${t('expMsg')}`);
  if(db.att.some(a=>a.mid===mid&&a.day===day&&(a.st==='P'||a.st==='L')))return banner(`${esc(m.name)} — ${t('dup')}`);
  const late=Math.max(0,Math.floor((now-startOf(e))/60000)),st=forced||(late>10?'L':'P');
  let r=recFor(e.id,mid);if(!r){r={eid:e.id,mid};db.att.push(r);}
  Object.assign(r,{st,mins:st==='L'?late:0,day,t:now.getTime(),cat:null,note:''});
  save();chime(st==='L');
  banner(`<div class="font-bold text-base">${esc(m.name)}</div><div class="text-xs opacity-90">${rl(m.role)} · ${t(LBL[st])}${st==='L'?' · '+t('lateBy').replace('{n}',late):''}</div>`,st==='L'?'o':'g');
  refresh();
}
function renderRes(){
  const el=$('#res');if(!el)return;const e=act(),q=($('#q')?.value||'').trim().toLowerCase();
  if(q){el.innerHTML=actives().filter(m=>(m.name+' '+m.id).toLowerCase().includes(q)).slice(0,8).map(m=>`<div class="${C} !p-3 mb-2 flex items-center gap-2"><div class="flex-1 min-w-0"><div class="font-semibold truncate">${esc(m.name)}</div><div class="text-xs text-slate-500">${m.id} · ${rl(m.role)}</div></div><button onclick="checkIn('${m.id}','P')" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold ${SC.P}">${t('present')}</button><button onclick="checkIn('${m.id}','L')" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold ${SC.L}">${t('late')}</button><button onclick="openExcuse('${m.id}')" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold ${SC.E}">${t('excuse')}</button></div>`).join('')||`<p class="text-center text-sm text-slate-500 py-4">${t('noRes')}</p>`;}
  else{el.innerHTML=!e?`<p class="text-center text-sm text-slate-500 py-4">${t('noEvt')}</p>`:db.att.filter(a=>a.eid===e.id).sort((a,b)=>b.t-a.t).slice(0,6).map(a=>`<div class="flex items-center justify-between bg-white dark:bg-slate-800 rounded-xl px-3 py-2.5 mb-2"><span class="text-sm font-medium truncate">${esc(memberById(a.mid)?.name)}</span>${badge(a.st)}</div>`).join('');}
}

/* ---------- Excuses ---------- */
function openExcuse(mid){if(!db.events.length)return banner(t('noEvt'));
  modal(t('excuseLog'),`<div class="space-y-3"><div class="text-xs text-slate-500">${t('members')}</div><select id="xm" class="${I}">${actives().map(m=>`<option value="${m.id}" ${m.id===mid?'selected':''}>${esc(m.name)} (${m.id})</option>`).join('')}</select><div class="text-xs text-slate-500">${t('events')}</div><select id="xe" class="${I}">${db.events.map(e=>`<option value="${e.id}" ${e.id===db.active?'selected':''}>${esc(e.name)} · ${e.date}</option>`).join('')}</select><div class="text-xs text-slate-500">${t('cat')}</div><select id="xc" class="${I}">${t('cats').map((c,i)=>`<option value="${i}">${c}</option>`).join('')}</select><textarea id="xn" rows="3" placeholder="${t('notes')}" class="${I}"></textarea>${btns('saveEx')}</div>`);}
function saveEx(){const mid=$('#xm').value,eid=$('#xe').value,r=recFor(eid,mid),rec={eid,mid,st:'E',mins:0,day:ld(),t:Date.now(),cat:+$('#xc').value,note:$('#xn').value.trim()};
  if(r)Object.assign(r,rec);else db.att.push(rec);save();closeM();refresh();banner(`${esc(memberById(mid).name)} — ${t('excused')}`,'g');}

/* ---------- Members ---------- */
let editId=null,editMid=null;
const bar=(fn,label)=>`<div class="flex gap-2 pt-2"><button onclick="closeM()" class="flex-1 rounded-xl py-2.5 text-sm font-semibold bg-slate-100 dark:bg-slate-700">${t('cancel')}</button><button onclick="${fn}" class="${B} flex-1">${label||t('save')}</button></div>`;
function migrate(){
  if(db.v!==2&&db.v!==3)db.members=db.members.filter(m=>m.role!=='Member');
  if(db.v!==3){const N={M001:'Jaborov Usmonali',M002:'Marinshoeva Shabnam',M003:'Muzafarovna Munisa',M004:'Sultonov Yusuf'};db.members.forEach(m=>{if(N[m.id])m.name=N[m.id];});db.v=3;}
  db.members.forEach(m=>{m.langs=m.langs||[];m.skills=m.skills||'';});
  db.events=db.events||[];db.att=db.att||[];
}
function clubMembers(){return db.members.filter(m=>m.role==='Member'&&!m.exp);}
function partCount(mid){return db.att.filter(a=>a.mid===mid&&(a.st==='P'||a.st==='L')).length;}
function line(name,date,st,extra){return `<div class="flex items-center justify-between gap-2 py-2 border-b border-slate-100 dark:border-slate-700"><div class="min-w-0"><div class="text-sm font-medium truncate">${esc(name)}</div><div class="text-[11px] text-slate-500">${[date,extra].filter(Boolean).join(' · ')}</div></div>${badge(st)}</div>`;}

function vMembers(){return `<div class="flex gap-2 mb-3"><input id="mq" oninput="renderMembers()" placeholder="${t('search')}" class="${I}"><button onclick="mForm()" class="${B} whitespace-nowrap">+ ${t('addM')}</button></div><div id="ml" class="space-y-2"></div>`;}
function renderMembers(){const q=($('#mq')?.value||'').trim().toLowerCase();
  $('#ml').innerHTML=db.members.filter(m=>(m.name+' '+m.id).toLowerCase().includes(q)).map(m=>`<div class="${C} !p-3 flex items-center gap-3 ${m.exp?'opacity-60':''}"><div class="w-10 h-10 shrink-0 rounded-full bg-[#643860] text-white grid place-items-center text-xs font-bold">${m.id.slice(1)}</div><button onclick="openProfile('${m.id}')" class="flex-1 min-w-0 text-left"><div class="font-semibold truncate">${esc(m.name)}${m.exp?` <span class="text-[10px] font-bold text-rose-600">· ${t('expelled')}</span>`:''}</div><div class="text-xs text-slate-500 truncate">${m.id} · ${rl(m.role)} · ${esc(m.uni)}</div></button><button onclick="openQR('${m.id}')" class="text-xs font-bold px-2.5 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-700">QR</button>${m.exp||m.role==='Head'?'':`<button onclick="expel('${m.id}')" class="text-xs font-semibold px-2.5 py-1.5 rounded-lg bg-rose-100 text-rose-700 dark:bg-rose-500/20 dark:text-rose-300">${t('expel')}</button>`}</div>`).join('');}
function expel(id){const m=memberById(id);if(!m||m.exp||m.role==='Head')return;if(!confirm(t('confirmExp')))return;m.exp=1;save();render();}

function mForm(m){editMid=m?m.id:null;const v=m||{name:'',role:'Member',uni:'',age:'',langs:[],skills:''};
  modal(m?t('editM'):t('addM'),`<div class="space-y-3"><input id="fn" value="${esc(v.name)}" placeholder="${t('name')}" class="${I}"><select id="fr" class="${I}" ${v.role==='Head'?'disabled':''}><option value="Member" ${v.role!=='Assistant'?'selected':''}>${t('mRole')}</option><option value="Assistant" ${v.role==='Assistant'?'selected':''}>${t('aRole')}</option></select><input id="fu" value="${esc(v.uni)}" placeholder="${t('uni')}" class="${I}"><input id="fa" type="number" min="14" max="60" value="${v.age}" placeholder="${t('age')}" class="${I}"><div><div class="text-xs text-slate-500 mb-1">${t('langs')}</div><input id="fl" value="${esc(v.langs.join(', '))}" placeholder="Tajik, Russian, English" class="${I}"></div><input id="fs" value="${esc(v.skills)}" placeholder="${t('skills')}" class="${I}">${bar('saveMem()')}</div>`);}
function saveMem(){const n=$('#fn').value.trim();if(!n)return banner('⚠ '+t('name'));
  const f={name:n,role:$('#fr').value,uni:$('#fu').value.trim(),age:+$('#fa').value||'',langs:$('#fl').value.split(/[,;،]+/).map(x=>x.trim()).filter(Boolean),skills:$('#fs').value.trim()};
  const m=editMid&&memberById(editMid);
  if(m){if(m.role==='Head')f.role='Head';Object.assign(m,f);}
  else{const max=db.members.reduce((x,y)=>Math.max(x,+y.id.slice(1)),0);db.members.push({id:'M'+String(max+1).padStart(3,'0'),...f,join:ld(),exp:0});}
  editMid=null;save();closeM();render();}

function openProfile(id){const m=memberById(id);if(!m)return;
  const recs=db.att.filter(a=>a.mid===id).map(a=>({e:db.events.find(x=>x.id===a.eid),a})).filter(x=>x.e);
  const abs=m.exp||m.role!=='Member'?[]:db.events.filter(e=>e.date<=ld()&&m.join<=e.date&&!recFor(e.id,id));
  const cnt=s=>recs.filter(x=>x.a.st===s).length;
  const items=[...recs.map(({e,a})=>({d:e.date,h:line(e.name,e.date,a.st,a.st==='L'?t('lateBy').replace('{n}',a.mins):a.st==='E'?esc(t('cats')[a.cat]||'')+(a.note?' — '+esc(a.note):''):'')})),...abs.map(e=>({d:e.date,h:line(e.name,e.date,'A','')}))].sort((x,y)=>y.d.localeCompare(x.d));
  modal(m.name,`<div class="flex items-center gap-3 mb-4"><div class="w-14 h-14 shrink-0 rounded-full bg-[#643860] text-white grid place-items-center font-extrabold">${m.id.slice(1)}</div><div class="min-w-0"><div class="font-extrabold text-lg truncate">${esc(m.name)}</div><div class="text-xs text-slate-500">${m.id} · ${rl(m.role)}${m.exp?' · '+t('expelled'):''}</div></div></div>
  <div class="space-y-1.5 text-sm mb-4"><div><span class="text-slate-500">${t('uni')}:</span> ${esc(m.uni)||'—'}</div><div><span class="text-slate-500">${t('age')}:</span> ${m.age||'—'}</div><div><span class="text-slate-500">${t('langs')} (${m.langs.length}):</span> ${m.langs.join(', ')||'—'}</div><div><span class="text-slate-500">${t('skills')}:</span> ${esc(m.skills)||'—'}</div></div>
  <div class="grid grid-cols-2 gap-2 mb-4">${tile(t('participated'),cnt('P')+cnt('L'),'emerald')}${tile(t('late'),cnt('L'),'orange')}${tile(t('excused'),cnt('E'),'sky')}${tile(t('absent'),abs.length,'rose')}</div>
  <div class="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-1">${t('events')}</div>${items.length?items.map(x=>x.h).join(''):`<div class="text-sm text-slate-500 py-2">${t('noData')}</div>`}
  <div class="grid grid-cols-2 gap-2 pt-4"><button onclick="closeM()" class="rounded-xl py-2.5 text-sm font-semibold bg-slate-100 dark:bg-slate-700">${t('close')}</button><button onclick="mForm(memberById('${id}'))" class="${B}">${t('edit')}</button></div>`);}

function openQR(id){const m=memberById(id);
  modal(t('badge'),`<div class="bg-white rounded-2xl p-5 text-center text-[#643860]"><div class="text-[11px] font-extrabold tracking-[.25em] text-sky-600">ROHBALAD CLUB</div><div id="qrc" class="mx-auto my-3 w-[200px] h-[200px]"></div><div class="font-extrabold text-lg">${esc(m.name)}</div><div class="text-sm">${m.id} · ${rl(m.role)}</div><div class="text-xs text-slate-500">${esc(m.uni)}</div></div><div class="flex gap-2 pt-4"><button onclick="closeM()" class="flex-1 rounded-xl py-2.5 text-sm font-semibold bg-slate-100 dark:bg-slate-700">${t('close')}</button><button onclick="dlBadge('${id}')" class="${B} flex-1">${t('dl')}</button></div>`);
  new QRCode($('#qrc'),{text:'ROHBALAD-'+id,width:200,height:200,colorDark:'#643860',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.H});}
function dlBadge(id){const m=memberById(id),src=$('#qrc canvas');if(!src)return;const c=document.createElement('canvas');c.width=640;c.height=800;const x=c.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,640,800);x.fillStyle='#643860';x.fillRect(0,0,640,130);x.fillStyle='#fff';x.textAlign='center';x.font='800 38px Inter,Arial,sans-serif';x.fillText('ROHBALAD CLUB',320,82);
  x.imageSmoothingEnabled=false;x.drawImage(src,120,170,400,400);
  x.fillStyle='#643860';x.font='800 42px Inter,Arial,sans-serif';x.fillText(m.name,320,635);
  x.fillStyle='#475569';x.font='500 30px Inter,Arial,sans-serif';x.fillText(`${m.id} · ${rl(m.role)}`,320,695);x.fillText(m.uni||'',320,740);
  const a=document.createElement('a');a.download=`rohbalad-${id}.png`;a.href=c.toDataURL('image/png');document.body.appendChild(a);a.click();a.remove();}

/* ---------- Events, reports, backup ---------- */
function vEvents(){const today=ld(),list=db.events.slice().sort((a,b)=>(b.date+b.start).localeCompare(a.date+a.start));
  return `<div class="${C} mb-3"><div class="text-[11px] font-semibold text-slate-500 uppercase tracking-wide mb-2">${t('active')}</div>${evSel()}</div>
  <div class="grid grid-cols-2 gap-2 mb-4"><button onclick="evForm()" class="${B}">+ ${t('addE')}</button><button onclick="openReport()" class="${B} !bg-slate-700">${t('report')}</button></div>
  <div class="space-y-2">${list.length?list.map(e=>{const up=e.date>today,tag=up?`<span class="text-[11px] font-bold text-emerald-600 dark:text-emerald-400 shrink-0">${t('upcoming')}</span>`:e.date<today?`<span class="text-[11px] text-slate-400 shrink-0">${t('done')}</span>`:'';
    return `<button onclick="openEvent('${e.id}')" class="${C} !p-3 w-full text-left block"><div class="flex items-center justify-between gap-2"><div class="font-semibold truncate">${esc(e.name)}</div>${tag}</div><div class="text-xs text-slate-500 mt-1">${e.date} · ${e.start}–${e.end} · ${esc(e.loc)}</div><div class="text-xs font-semibold mt-2">${t('attend')}: ${up?'—':stats(e.id).rate+'%'}</div></button>`;}).join(''):`<p class="text-center text-sm text-slate-500 py-6">${t('noEvt')}</p>`}</div>
  <div class="${C} mt-4 space-y-3"><div class="font-semibold">${t('bk')}</div><button onclick="backup()" class="${B} w-full">${t('backup')}</button></div>`;}

function evForm(e){editId=e?e.id:null;const v=e||{name:'',date:ld(),start:'14:00',end:'17:00',loc:''};
  modal(e?t('editE'):t('addE'),`<div class="space-y-3"><input id="en" value="${esc(v.name)}" placeholder="${t('ename')}" class="${I}"><input id="ed" type="date" value="${v.date}" class="${I}"><div class="grid grid-cols-2 gap-2"><label class="text-xs text-slate-500">${t('start')}<input id="es" type="time" value="${v.start}" class="${I} mt-1"></label><label class="text-xs text-slate-500">${t('end')}<input id="ee" type="time" value="${v.end}" class="${I} mt-1"></label></div><input id="el" value="${esc(v.loc)}" placeholder="${t('loc')}" class="${I}">${bar('saveEv()')}</div>`);}
function saveEv(){const n=$('#en').value.trim();if(!n)return banner('⚠ '+t('ename'));
  const f={name:n,date:$('#ed').value||ld(),start:$('#es').value||'14:00',end:$('#ee').value||'17:00',loc:$('#el').value.trim()};
  const e=editId&&db.events.find(x=>x.id===editId);
  if(e)Object.assign(e,f);else{const ne={id:'E'+Date.now().toString(36),...f};db.events.push(ne);db.active=ne.id;}
  editId=null;save();closeM();render();}

function openEvent(id){const e=db.events.find(x=>x.id===id);if(!e)return;const past=e.date<=ld();
  const rows=clubMembers().map(m=>{const a=recFor(id,m.id);return {m,a,st:a?a.st:(past&&m.join<=e.date?'A':'')};}).filter(x=>x.st);
  const grp=s=>rows.filter(x=>x.st===s);
  const sec=s=>grp(s).length?`<div class="mb-3"><div class="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-1">${t(LBL[s])} (${grp(s).length})</div>${grp(s).map(x=>line(x.m.name,'',s,s==='L'?t('lateBy').replace('{n}',x.a.mins):s==='E'?esc(t('cats')[x.a.cat]||'')+(x.a.note?' — '+esc(x.a.note):''):'')).join('')}</div>`:'';
  modal(e.name,`<div class="text-sm text-slate-500 mb-3">${e.date} · ${e.start}–${e.end} · ${esc(e.loc)}</div>${past?`<div class="grid grid-cols-2 gap-2 mb-4">${tile(t('present'),grp('P').length,'emerald')}${tile(t('late'),grp('L').length,'orange')}${tile(t('excused'),grp('E').length,'sky')}${tile(t('absent'),grp('A').length,'rose')}</div>`:`<div class="mb-4 text-xs font-bold text-emerald-600">${t('upcoming')}</div>`}${rows.length?['P','L','E','A'].map(sec).join(''):`<div class="text-sm text-slate-500 mb-4">${t('noData')}</div>`}<div class="grid grid-cols-2 gap-2 pt-2"><button onclick="evForm(db.events.find(x=>x.id==='${id}'))" class="${B}">${t('edit')}</button><button onclick="delEv('${id}')" class="rounded-xl py-2.5 text-sm font-semibold bg-rose-100 text-rose-700 dark:bg-rose-500/20 dark:text-rose-300">${t('delE')}</button></div><button onclick="exportCSV('${id}')" class="mt-2 w-full rounded-xl py-2.5 text-sm font-semibold bg-slate-100 dark:bg-slate-700">${t('dlSheet')}</button>`);}
function delEv(id){if(!confirm(t('confirmDelE')))return;db.events=db.events.filter(x=>x.id!==id);db.att=db.att.filter(a=>a.eid!==id);if(db.active===id)db.active='';save();closeM();render();}
function openReport(){modal(t('report'),`<div class="space-y-3"><select id="rs" class="${I}"><option value="">${t('allEv')}</option>${db.events.map(e=>`<option value="${e.id}">${esc(e.name)} · ${e.date}</option>`).join('')}</select><button onclick="doReport()" class="${B} w-full">${t('dlSheet')}</button><button onclick="copyReport()" class="w-full rounded-xl py-2.5 text-sm font-semibold bg-slate-100 dark:bg-slate-700">${t('copy')}</button><p class="text-xs text-slate-500">${t('sheetHint')}</p></div>`);}
function doReport(){exportCSV($('#rs').value||null);closeM();}
function copyReport(){const txt=toTable($('#rs').value||null);closeM();navigator.clipboard.writeText(txt).then(()=>banner(t('copied'),'g')).catch(()=>banner('⚠ '+t('copyFail')));}
function sheetRows(only){
  const today=ld(),evs=only?db.events.filter(e=>e.id===only):db.events.slice().sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));
  const ms=db.members.filter(m=>m.role==='Member'&&(!m.exp||db.att.some(a=>a.mid===m.id)));
  const cell=(e,m)=>{const a=recFor(e.id,m.id);
    if(!a){const no=m.exp||e.date>today||m.join>e.date;return {k:no?'':'A',x:no?'':t('absent')};}
    const x=a.st==='L'?t('lateBy').replace('{n}',a.mins):a.st==='E'?`${t('excused')} (${t('cats')[a.cat]||''})${a.note?' — '+a.note:''}`:t(LBL[a.st]);
    return {k:a.st,x,a};};
  if(only){const e=evs[0];
    return [['ID','Name','Role','University','Event','Date','Start','Location','Status','Minutes late','Excuse','Note','Recorded at'],
      ...ms.map(m=>{const c=cell(e,m);return c.k?[m.id,m.name,rl(m.role),m.uni,e.name,e.date,e.start,e.loc,t(LBL[c.k]),c.k==='L'?c.a.mins:'',c.k==='E'?t('cats')[c.a.cat]:'',c.a?.note||'',c.a?new Date(c.a.t).toLocaleString():'']:null;}).filter(Boolean)];
  }
  const head=['ID','Name','Role','University',...evs.map(e=>`${e.name} (${e.date})`),t('present'),t('late'),t('excused'),t('absent'),t('participated')];
  const body=ms.map(m=>{const cs=evs.map(e=>cell(e,m)),n=k=>cs.filter(c=>c.k===k).length;return [m.id,m.name,rl(m.role),m.uni,...cs.map(c=>c.x),n('P'),n('L'),n('E'),n('A'),n('P')+n('L')];});
  const totals=['P','L','E','A'].map(k=>['','','',t(LBL[k]),...evs.map(e=>ms.filter(m=>cell(e,m).k===k).length)]);
  return [head,...body,[],...totals];
}
const cellTxt=v=>String(v??'').replace(/[\r\n]+/g,' ');
function toCSV(rows){return '\ufeff'+rows.map(r=>r.map(v=>`"${cellTxt(v).replace(/"/g,'""')}"`).join(',')).join('\r\n');}
function toTable(only){return sheetRows(only).map(r=>r.map(cellTxt).join('\t')).join('\n');}
function exportCSV(only){download(`rohbalad-${only?'event':'report'}-${ld()}.csv`,'text/csv;charset=utf-8',toCSV(sheetRows(only)));}
function download(name,type,data){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
/* ---------- Backup (Google Sheets workbook) ---------- */
const CRC_T=(()=>{const tbl=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;tbl[n]=c>>>0;}return tbl;})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRC_T[(c^u8[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function zipBlob(files){
  const enc=new TextEncoder(),parts=[],cd=[];let off=0;
  files.forEach(([name,text])=>{
    const nm=enc.encode(name),data=enc.encode(text),crc=crc32(data);
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,0,true);h.setUint16(12,0x21,true);
    h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,nm.length,true);h.setUint16(28,0,true);
    parts.push(new Uint8Array(h.buffer),nm,data);
    const c=new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);c.setUint16(12,0,true);c.setUint16(14,0x21,true);
    c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,nm.length,true);c.setUint16(30,0,true);c.setUint16(32,0,true);c.setUint16(34,0,true);c.setUint16(36,0,true);c.setUint32(38,0,true);c.setUint32(42,off,true);
    cd.push(new Uint8Array(c.buffer),nm);
    off+=30+nm.length+data.length;
  });
  const cdSize=cd.reduce((a,p)=>a+p.length,0);
  const e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cdSize,true);e.setUint32(16,off,true);
  return new Blob([...parts,...cd,new Uint8Array(e.buffer)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
function xlsxBlob(sheets){
  const XH='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>',NS='http://schemas.openxmlformats.org/spreadsheetml/2006/main',RNS='http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  const xe=v=>String(v??'').replace(/[\x00-\x08\x0b\x0c\x0e-\x1f]/g,'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
  const col=i=>{let s='';for(i++;i>0;i=Math.floor((i-1)/26))s=String.fromCharCode(65+(i-1)%26)+s;return s;};
  const cellX=(v,ref,hdr)=>(typeof v==='number'&&Number.isFinite(v)&&!hdr)?`<c r="${ref}"><v>${v}</v></c>`:`<c r="${ref}" t="inlineStr"${hdr?' s="1"':''}><is><t xml:space="preserve">${xe(v)}</t></is></c>`;
  const sheetXml=rows=>XH+`<worksheet xmlns="${NS}"><sheetData>`+rows.map((r,ri)=>`<row r="${ri+1}">`+r.map((v,ci)=>cellX(v,col(ci)+(ri+1),ri===0)).join('')+'</row>').join('')+'</sheetData></worksheet>';
  const files=[
    ['[Content_Types].xml',XH+`<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`],
    ['_rels/.rels',XH+`<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${RNS}/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
    ['xl/workbook.xml',XH+`<workbook xmlns="${NS}" xmlns:r="${RNS}"><sheets>${sheets.map((s,i)=>`<sheet name="${xe(s.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets></workbook>`],
    ['xl/_rels/workbook.xml.rels',XH+`<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="${RNS}/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length+1}" Type="${RNS}/styles" Target="styles.xml"/></Relationships>`],
    ['xl/styles.xml',XH+`<styleSheet xmlns="${NS}"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`],
    ...sheets.map((s,i)=>[`xl/worksheets/sheet${i+1}.xml`,sheetXml(s.rows)])
  ];
  return zipBlob(files);
}
function backup(){
  const sheets=[
    {name:'Members',rows:[['ID','Name','Role','University','Age','Languages','Skills','Joined','Status'],...db.members.map(m=>[m.id,m.name,rl(m.role),m.uni,m.age,(m.langs||[]).join(', '),m.skills||'',m.join||'',m.exp?'Expelled':'Active'])]},
    {name:'Events',rows:[['Name','Date','Start','End','Location','Active'],...db.events.map(e=>[e.name,e.date,e.start,e.end,e.loc,e.id===db.active?'yes':''])]},
    {name:'Attendance',rows:[['Event','Event date','Member ID','Member name','Status','Minutes late','Excuse','Note','Recorded at'],...db.att.map(r=>{const e=db.events.find(x=>x.id===r.eid),m=memberById(r.mid);return [e?e.name:'',e?e.date:'',r.mid,m?m.name:'',t(LBL[r.st]),r.st==='L'?r.mins:'',r.st==='E'?t('cats')[r.cat]:'',r.note||'',new Date(r.t).toLocaleString()];})]}
  ];
  const a=document.createElement('a');a.href=URL.createObjectURL(xlsxBlob(sheets));a.download=`rohbalad-backup-${new Date().toISOString().slice(0,19).replace(/[T:]/g,'-')}.xlsx`;document.body.appendChild(a);a.click();a.remove();
}

let dayKey=ld();
applyTheme();save();render();
setInterval(()=>{if(ld()!==dayKey){dayKey=ld();if(tab==='dash')render();}},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ld()!==dayKey){dayKey=ld();if(tab==='dash')render();}});
</script>
